[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "waves"
version = "0.1.0"
description = "WAVES: Watermark-Aware Violation Detection for Streaming - Extension of StreamDaQ"
authors = [
    {name = "Thesis Project"}
]
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = [
    "pathway~=0.26.4",
    "matplotlib==3.10.1",
    "python-dateutil==2.9.0.post0",
    "datasketch~=1.6.5",
    "datasketches~=5.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "black>=22.0",
    "isort>=5.10",
]

[tool.setuptools]
packages = ["waves"]

[tool.setuptools.package-dir]
waves = "waves"

[tool.black]
line-length = 120
target-version = ['py311']

[tool.isort]
profile = "black"
line_length = 120
